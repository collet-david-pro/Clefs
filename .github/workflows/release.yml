name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output_name: clefs-windows-amd64.exe
            archive_name: clefs-windows-amd64.zip
            cgo_enabled: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies (Windows)
        if: matrix.goos == 'windows'
        run: choco install mingw -y
      
      - name: Get Go dependencies
        run: go mod download

      # --- Windows Build ---
      - name: Build (Windows)
        if: matrix.goos == 'windows'
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          go build -ldflags="-s -w -H windowsgui" -o ${{ matrix.output_name }} ./cmd/main.go
      
      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ matrix.output_name }}, infos.txt -DestinationPath ${{ matrix.archive_name }}

      # --- Upload Artifact ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.archive_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -name "*.zip" -exec cp -r {} release-files/ \;
          ls -lh release-files/

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          # Gestionnaire de Clés ${{ steps.get_version.outputs.VERSION }}
          
          ## 📦 Fichiers disponibles
          
          ### Windows (64-bit)
          - **clefs-windows-amd64.zip**: Archive contenant l'exécutable `clefs-windows-amd64.exe`.
          
          ## 🚀 Installation & Utilisation

          **Important**: Avant le premier lancement, placez l'exécutable dans un dossier dédié et consultez `infos.txt`.

          ### Windows
          1. Téléchargez et décompressez `clefs-windows-amd64.zip`.
          2. Double-cliquez sur `clefs-windows-amd64.exe` pour lancer.
          
          ## 📂 Structure des Fichiers
          
          Après le premier lancement, votre dossier ressemblera à ceci :
          
          ```
          MonDossierClefs/
          ├── clefs-windows-amd64.exe (ou autre exécutable)
          ├── infos.txt
          ├── clefs.db (créé automatiquement)
          ├── backups/ (sauvegardes automatiques)
          └── documents/ (PDFs générés)
          ```
          
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-files/*
          body_path: release_notes.md
          draft: false
          prerelease: false
