name: Release

# Publie une release GitHub au push d'un tag v* (ex. v4.0.0).
# V4 : Windows x64 uniquement, application Wails (Go + interface Svelte).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Run Go tests
        run: go test ./...

      # -webview2 error : si WebView2 manque sur un poste, l'application
      # affiche un message clair au lieu de proposer une installation.
      - name: Build
        run: wails build -clean -trimpath -webview2 error -o clefs-windows-amd64.exe

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/bin/clefs-windows-amd64.exe, infos.txt -DestinationPath clefs-windows-amd64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-amd64
          path: clefs-windows-amd64.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows-amd64
          path: release-files

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        run: |
          cat > release_notes.md << 'EOF'
          # Gestionnaire de Clés ${{ steps.get_version.outputs.VERSION }}

          ## 📦 Fichier disponible

          - **clefs-windows-amd64.zip** : l'exécutable `clefs-windows-amd64.exe` et la notice `infos.txt`.

          ## 🚀 Installation

          1. Créez un **nouveau dossier** dédié (ex. `C:\Clefs-V4\`) et décompressez-y l'archive.
          2. Double-cliquez sur `clefs-windows-amd64.exe`. Rien d'autre à installer.
          3. Au premier lancement, l'assistant d'import propose de reprendre la base de l'ancienne version (`clefs.db`).

          Windows peut afficher une alerte car l'exécutable n'est pas signé :
          « Informations complémentaires » → « Exécuter quand même ».

          ## 🔄 Mise à jour

          - **Depuis une version 1, 2 ou 3** : nouvelle installation dans un nouveau dossier, puis import de l'ancienne base avec l'assistant (l'ancien dossier n'est pas modifié).
          - **Depuis une version 4** : sauvegarde depuis l'application, fermeture sur tous les postes, puis remplacement du `.exe` dans le même dossier.

          ## 📖 Prise en main

          Le guide illustré en 7 étapes est sur la [page d'accueil du projet](https://github.com/${{ github.repository }}#-prise-en-main-en-7-étapes) ; l'aide est aussi intégrée à l'application (menu **Aide**).
          Nouveautés de la version : [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

          ## 📂 Structure du dossier

          ```
          MonDossierClefs/
          ├── clefs-windows-amd64.exe
          ├── infos.txt
          ├── clefs.db      (créé automatiquement)
          ├── backups/      (sauvegardes)
          └── documents/    (PDF et exports Excel)
          ```
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-files/*
          body_path: release_notes.md
          draft: false
          prerelease: false
